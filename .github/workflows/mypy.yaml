name: Security, build, and tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install PDF validator
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qpdf

      - name: Install audited development dependencies
        run: python -m pip install --disable-pip-version-check -r local-requirements.txt pip-audit==2.10.1

      - name: Audit dependencies and bundled PDFs
        run: |
          python -m pip_audit -r local-requirements.txt
          python scripts/audit_pdfs.py

      - name: Static security, typing, and syntax checks
        run: |
          python -m bandit -q -r lib src scripts
          python -m mypy --strict .
          python -m ruff check --select E9,F63,F7,F82 .
          python -m compileall -q lib src tests scripts

      - name: Build data and run all tests in the isolated builder
        run: docker buildx build --load --tag courserekt-ci .
