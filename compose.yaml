name: courserekt

services:
  app:
    image: ${COURSEREKT_IMAGE:-courserekt:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - /srv/courserekt/run:/run/courserekt
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.5
