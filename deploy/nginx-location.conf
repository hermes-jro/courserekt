# Include these locations inside the TLS server block for agent.jro.sg.
location = /courserekt {
    return 308 /courserekt/;
}

location /courserekt/ {
    proxy_pass http://unix:/srv/courserekt/run/http.sock:/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /courserekt;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
    proxy_buffering off;
}
